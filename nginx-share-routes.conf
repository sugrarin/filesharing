# If generated s/{id}/index.html pages are deployed, keep share URLs canonical
# and let nginx serve the directory index.
rewrite ^/s/([a-z0-9]{5})$ /s/$1/ permanent;

# Alternative PHP-rendered mode, if generated index.html pages are not deployed:
# rewrite ^/s/([a-z0-9]{5})$ /file.php?id=$1 last;

# Folder shares
# rewrite ^/f/([A-Za-z]{5})$ /folder.php?id=$1 last;

# Direct links such as /s/6se2u.pdf must keep being served as static files.

